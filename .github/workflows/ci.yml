name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest ships bash 3.2: this is the real compatibility check for stock Macs.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show shell and python
        run: |
          bash --version | head -1
          python3 --version
      - name: Run the suite
        run: bash tests/run_tests.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning scripts/*.sh scripts/hooks/*.sh adapters/*.sh tests/*.sh
